# N42 Performance-Optimized Configuration
# 
# This configuration is tuned for maximum TPS and minimum RPC latency.
# Use with: n42 node --config config/performance.toml

[rpc]
# Increase cache sizes for better hit rates
max_blocks = 2000
max_receipts = 4000
max_headers = 4000
max_concurrent_db_requests = 1024

[rpc.ws]
# WebSocket optimization
max_request_body_size = 15728640  # 15MB
max_response_body_size = 15728640
max_connections = 500
message_buffer_capacity = 4096

[rpc.http]
# HTTP optimization
max_request_body_size = 15728640
max_response_body_size = 15728640
max_connections = 1000

[txpool]
# Transaction pool optimization
max_pending_txns = 8192
max_new_txns = 4096
max_cached_entries = 4096

[network]
# Network optimization for higher throughput
max_outbound_peers = 100
max_inbound_peers = 100

[db]
# Database optimization
# Use larger page sizes for better read performance
# log_level = "warn"  # Reduce logging overhead in production

[stages]
# Pipeline optimization
# bodies.downloader_max_concurrent_requests = 32
# headers.downloader_max_concurrent_requests = 32

# Memory-mapped file settings (for static files)
# static_file.memory_map = true

