bytes.workspace = true
secp256k1 = { workspace = true, features = ["recovery"] }

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "alloy-rlp/std",
    "bytes/std",
    "reth-primitives-traits/std",
    "secp256k1/std",
]
