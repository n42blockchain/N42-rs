# Error handling
thiserror.workspace = true
eyre.workspace = true

# Logging
tracing.workspace = true

# Async
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
default = ["std"]
std = []

