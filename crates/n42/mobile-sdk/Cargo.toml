[package]
name = "mobile-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
n42-tx-types.workspace = true
n42-engine-types.workspace = true
jni = "0.21"
once_cell = "1.21"
alloy-rpc-types-beacon.workspace = true
tree_hash.workspace = true
tree_hash_derive.workspace = true
eyre.workspace = true
alloy-primitives.workspace = true
n42-clique.workspace = true
n42-primitives.workspace = true
revm-primitives.workspace = true
reth-provider = { workspace = true, features = ["test-utils"] }
reth-revm.workspace = true
reth-chainspec.workspace = true
reth-ethereum-primitives.workspace = true
reth-evm-ethereum.workspace = true
reth-evm.workspace = true
reth-primitives-traits.workspace = true
rand.workspace = true
jsonrpsee = { workspace = true, features = ["server", "ws-client"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
blst = { version = "0.3.3" }
hex = "0.4"
# Keep the existing public ABI/transaction types without the deprecated
# ethers RPC stack (reqwest 0.11, hyper 0.14 and jsonwebtoken 8).
ethers-core = { version = "2.0.14", default-features = false }

[dev-dependencies]
tracing-appender.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.5.23", features = ["derive"] }
alloy-provider.workspace = true
alloy-network.workspace = true
alloy-consensus.workspace = true
alloy-signer-local.workspace = true
alloy-rpc-types-eth = { workspace = true, features = ["serde"] }

[lints]
workspace = true
