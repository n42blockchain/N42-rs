[package]
name = "n42-mobile-verify"
version.workspace = true
edition.workspace = true
# Ported from ../N42-26 (rustc 1.97). Higher than the workspace's 1.86: the twig
# SIMD kernel uses AVX-512 intrinsics stabilised in 1.89, and the H2 codecs use
# 1.87 APIs. Declared per-crate so the rest of the workspace keeps its MSRV.
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Mobile verification wire formats: receipts, attestations, twig/SBMT state proofs — ported from N42-26"

[dependencies]
n42-h2-primitives.workspace = true
n42-bmt-core.workspace = true
n42-twig-core.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
bincode.workspace = true
thiserror.workspace = true
hex.workspace = true
lru = "0.18"
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
