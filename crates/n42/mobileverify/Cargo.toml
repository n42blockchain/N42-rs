[package]
name = "n42-mobileverify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "gov5's /mobileverify phone surface in Rust: registry, accumulator, cohort certificates, StreamPacket V2 and the HTTP server"

[lints]
workspace = true

[dependencies]
n42-h2-primitives.workspace = true
n42-header.workspace = true
alloy-consensus = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std"] }
alloy-rlp = { workspace = true, features = ["std"] }
blst.workspace = true
blake3.workspace = true
prost.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tracing.workspace = true
bytes = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["net", "rt", "time", "macros", "sync"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time", "macros", "io-util", "sync"] }
sha2.workspace = true
alloy-eips = { workspace = true, features = ["std"] }
