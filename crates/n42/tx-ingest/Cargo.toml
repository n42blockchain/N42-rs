[package]
name = "n42-tx-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Binary TCP transaction ingest for throughput rounds"

[lints]
workspace = true

[dependencies]
bytes.workspace = true
reth-transaction-pool.workspace = true
libc.workspace = true
n42-tx-queue.workspace = true
n42-tx-types.workspace = true
reth-primitives-traits.workspace = true
reth-evm.workspace = true
alloy-primitives.workspace = true
alloy-eips.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "time"] }
tracing.workspace = true

[dev-dependencies]
# `start_paused` drives the gate's deadline without a test that sleeps.
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# The shard-mode test runs a frame through the real recovery on the node's
# pool transaction type, with signed 0x50 transactions.
n42-engine-types.workspace = true
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
