[workspace]
members = ["relay"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
alloy-primitives = { version = "1.7.3", features = ["serde"] }
alloy-sol-types = "1.7.3"
alloy-signer = "2.5.0"
alloy-signer-local = "2.5.0"
alloy-consensus = "2.5.0"
alloy-eips = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
eyre = "0.6"
