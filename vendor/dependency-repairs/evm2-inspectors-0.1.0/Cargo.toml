# Flattened from evm2 592bf18c4e22fff54ac9b4db606c4ee276e345cb crates/inspectors/Cargo.toml
# (workspace inheritance resolved from that revision's root Cargo.toml; dev-dependencies,
# tests and lints dropped). See N42-PROVENANCE.md.
[package]
name = "evm2-inspectors"
description = "evm2 inspector implementations"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["DaniPopes <57450786+DaniPopes@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/danipopes/evm2"

[dependencies]
# eth
alloy-consensus = { version = "2.0.4", default-features = false }
alloy-eip2930 = { version = "0.2.4", default-features = false }
alloy-eips = { version = "2.0.4", default-features = false, features = ["k256"] }
alloy-rpc-types-eth = { version = "2.0.4", default-features = false }
alloy-rpc-types-trace = { version = "2.0.4", default-features = false }
alloy-sol-types = { version = "1.5.7", default-features = false }
alloy-primitives = { version = "1.5.7", default-features = false, features = ["map"] }
# The same evm2 the rest of the graph resolves (not patched).
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb", default-features = false }

anstyle = { version = "1.0", default-features = false, optional = true }
colorchoice = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }

# serde
serde = { version = "1.0", default-features = false, optional = true, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# js-tracer
boa_engine = { version = "0.22", default-features = false, optional = true }
boa_gc = { version = "0.22", default-features = false, optional = true }
num-bigint = { version = "0.5", default-features = false, optional = true }

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "alloy-consensus/std",
    "alloy-eip2930/std",
    "alloy-eips/std",
    "alloy-rpc-types-eth/std",
    "alloy-sol-types/std",
    "anstyle/std",
    "serde/std",
    "serde_json/std",
    "evm2/std",
    "thiserror/std",
    "num-bigint?/std",
]
serde = [
    "dep:serde",
    "num-bigint?/serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-eip2930/serde",
    "alloy-eips/serde",
    "alloy-rpc-types-eth/serde",
    "evm2/serde",
]
js-tracer = ["std", "dep:boa_engine", "dep:boa_gc", "dep:num-bigint"]

[workspace]
