[package]
name = "reth-transaction-pool"
version = "2.7.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
homepage = "https://paradigmxyz.github.io/reth"
repository = "https://github.com/paradigmxyz/reth"
description = "Transaction pool implementation"



[dependencies]
# reth
reth-chain-state = { "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0" }
reth-ethereum-primitives = { "default-features" = false, "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0" }
reth-chainspec = { "default-features" = false, "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0" }
reth-eth-wire-types = { "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0" }
reth-evm = { "default-features" = false, "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0" }
reth-evm-ethereum = { "default-features" = false, "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0" }
reth-primitives-traits = { "version" = "0.8.1", "default-features" = false }
reth-execution-types = { "default-features" = false, "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0" }
reth-fs-util = { "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0" }
reth-storage-api = { "default-features" = false, "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0" }
reth-tasks = { "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0" }
revm = { "version" = "43.0.3", "default-features" = false }

# ethereum
alloy-eips = { "version" = "2.5.0", "default-features" = false, "features" = ["kzg"] }
alloy-primitives = { "version" = "1.6.1", "default-features" = false, "features" = ["map-foldhash"] }
alloy-rlp = { "version" = "0.3.16", "default-features" = false, "features" = ["core-net"] }
alloy-consensus = { "version" = "2.5.0", "default-features" = false, "features" = ["kzg"] }
# async/futures
futures-util = { "version" = "0.3", "default-features" = false }
parking_lot = { "version" = "0.12" }
pin-project = { "version" = "1.1.12" }
tokio = { "version" = "1.52.3", "default-features" = false, "features" = ["sync"] }
tokio-stream = { "version" = "0.1.11" }

# metrics
reth-metrics = { "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0" }
metrics = { "version" = "0.24.0" }

# misc
aquamarine = { "version" = "0.6" }
thiserror = { "version" = "2.0.0", "default-features" = false }
tracing = { "version" = "0.1.0", "default-features" = false, "features" = ["attributes"] }
rustc-hash = { "version" = "2.0", "default-features" = false }
schnellru = { "version" = "0.2" }
serde = { "version" = "1.0", "default-features" = false, "features" = ["derive", "rc"] }
serde_json = { "version" = "1.0", "default-features" = false, "features" = ["alloc"] }
bitflags = { "version" = "2.4" }
auto_impl = { "version" = "1" }
imbl = { "version" = "7" }
smallvec = { "version" = "1" }

# testing
rand = { "version" = "0.9", "optional" = true }
paste = { package = "pastey", version = "0.2.3", optional = true }
proptest = { "version" = "1.7", "optional" = true }
proptest-arbitrary-interop = { "version" = "0.1.0", "optional" = true }
[dev-dependencies]
reth-provider = { "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0", "features" = ["test-utils"] }
reth-tracing = { "version" = "0.1.0", "default-features" = false, "features" = ["attributes"] }
alloy-primitives = { "version" = "1.6.1", "default-features" = false, "features" = ["map-foldhash", "rand"] }
paste = { package = "pastey", version = "0.2.3" }
rand = { "version" = "0.9" }
proptest = { "version" = "1.7" }
proptest-arbitrary-interop = { "version" = "0.1.0" }
assert_matches = { "version" = "1.5.0" }
tempfile = { "version" = "3.20" }
tokio = { "version" = "1.52.3", "default-features" = false, "features" = ["rt-multi-thread"] }
futures = { "version" = "0.3" }
criterion = { "package" = "codspeed-criterion-compat", "version" = "4.3" }
reth-transaction-pool = { "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v2.7.0", "features" = ["test-utils"] }
[features]
serde = [
    "reth-execution-types/serde",
    "reth-eth-wire-types/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "bitflags/serde",
    "imbl/serde",
    "parking_lot/serde",
    "rand?/serde",
    "smallvec/serde",
    "reth-primitives-traits/serde",
    "reth-ethereum-primitives/serde",
    "reth-chain-state/serde",
    "reth-storage-api/serde",
    "revm/serde",
    "reth-transaction-pool/serde",
]
test-utils = [
    "rand",
    "paste",
    "serde",
    "reth-chain-state/test-utils",
    "reth-chainspec/test-utils",
    "reth-provider/test-utils",
    "reth-primitives-traits/test-utils",
    "reth-ethereum-primitives/test-utils",
    "alloy-primitives/rand",
    "reth-evm/test-utils",
    "reth-evm-ethereum/test-utils",
    "reth-tasks/test-utils",
    "reth-transaction-pool/test-utils",
]
arbitrary = [
    "proptest",
    "proptest-arbitrary-interop",
    "imbl/arbitrary",
    "reth-chainspec/arbitrary",
    "reth-eth-wire-types/arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "bitflags/arbitrary",
    "reth-primitives-traits/arbitrary",
    "smallvec/arbitrary",
    "reth-ethereum-primitives/arbitrary",
    "revm/arbitrary",
    "imbl/arbitrary",
    "reth-transaction-pool/arbitrary",
]

[[bench]]
name = "saturated_pool"
harness = false
required-features = ["test-utils"]

[workspace]
